<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GiftMoji — Voucher QR Prototype</title>
<style>
	body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
	section { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
	h2 { margin-top: 0; font-size: 1.1rem; }
	button { padding: 0.5rem 1rem; cursor: pointer; }
	input { padding: 0.4rem; width: 60%; }
	img { display: block; margin-top: 1rem; border: 1px solid #eee; }
	pre { background: #f6f6f6; padding: 0.75rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
	.ok { color: #1a7f37; }
	.err { color: #c0392b; }
</style>
</head>
<body>
<h1>GiftMoji voucher prototype</h1>

<section>
	<h2>1. Issue a voucher</h2>
	<button id="issueBtn">Issue voucher</button>
	<pre id="issueResult"></pre>
	<img id="qrImg" alt="" style="display:none; width:220px; height:220px;">
</section>

<section>
	<h2>2. Redeem a voucher</h2>
	<input id="redeemCode" placeholder="voucher code">
	<button id="redeemBtn">Redeem</button>
	<pre id="redeemResult"></pre>
</section>

<script>
const issueBtn = document.getElementById('issueBtn');
const issueResult = document.getElementById('issueResult');
const qrImg = document.getElementById('qrImg');
const redeemCode = document.getElementById('redeemCode');
const redeemBtn = document.getElementById('redeemBtn');
const redeemResult = document.getElementById('redeemResult');

issueBtn.addEventListener('click', async () => {
	issueResult.textContent = 'Issuing...';
	qrImg.style.display = 'none';
	const res = await fetch('/api/vouchers', {
		method: 'POST',
		headers: { 'Content-Type': 'application/json' },
		body: JSON.stringify({})
	});
	const data = await res.json();
	issueResult.textContent = JSON.stringify(data, null, 2);
	qrImg.src = data.qrUrl + '?t=' + Date.now();
	qrImg.style.display = 'block';
	redeemCode.value = data.code;
});

redeemBtn.addEventListener('click', async () => {
	const code = redeemCode.value.trim();
	if (!code) return;
	redeemResult.textContent = 'Redeeming...';
	redeemResult.className = '';
	const res = await fetch('/api/vouchers/' + encodeURIComponent(code) + '/redeem', { method: 'POST' });
	const data = await res.json().catch(() => ({}));
	redeemResult.textContent = res.status + ' ' + JSON.stringify(data, null, 2);
	redeemResult.className = res.ok ? 'ok' : 'err';
});
</script>
</body>
</html>
