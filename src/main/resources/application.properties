spring.application.name=GiftMoji

# Azure App Service (Linux) sets the PORT env var; default to 8080 for local runs.
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info

# Prototype datastore: in-memory H2, reset on every restart. Swap for
# Azure SQL Database once the app moves past the QR create/redeem prototype.
spring.datasource.url=jdbc:h2:mem:giftmoji;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
