spring.application.name=GiftMoji

# Azure App Service (Linux) sets the PORT env var; default to 8080 for local runs.
server.port=${PORT:8080}

# Azure App Service terminates TLS at its front-end and forwards to this app
# over plain HTTP, adding X-Forwarded-Proto/Host headers. Without this, Spring
# builds absolute URLs (e.g. the OAuth2 redirect_uri) using the internal
# http:// scheme, which then mismatches the https:// URI registered with
# Google and fails with "Error 400: redirect_uri_mismatch".
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health,info

# Default (local dev) datastore: in-memory H2, reset on every restart.
# The 'azure' profile (application-azure.properties) points at the real
# Azure SQL Database instead — activate it via SPRING_PROFILES_ACTIVE=azure.
spring.datasource.url=jdbc:h2:mem:giftmoji;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Google OAuth2/OIDC login. "google" is a recognized Spring Boot provider id,
# so only client-id/secret are needed here. Real values must come from env
# vars (never hardcoded) — the fallback below only keeps the app/tests
# bootable when they're unset; it is not a login bypass.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:missing-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:missing-google-client-secret}
